# H2 in-memory database
spring.datasource.url = jdbc:h2:mem:mybatisdb
spring.datasource.username = sa
spring.datasource.password = sa
spring.datasource.driverClassName = org.h2.Driver
spring.h2.console.enabled = true
spring.h2.console.path = /h2-console
spring.h2.console.settings.web-allow-others = true
spring.sql.init.mode = embedded
spring.sql.init.schema-locations = classpath:db/schema.sql
spring.sql.init.data-locations = classpath:db/data.sql

# MyBatis entity package alias
mybatis.type-aliases-package = com.richard.demo.entity
# MyBatis mapper XML locations
mybatis.mapper-locations = classpath:/mappers/*.xml
# Log level for MyBatis mapper layer
logging.level.com.richard.demo.dao = debug

server.port = 8081

# redis config
spring.data.redis.host = localhost
spring.data.redis.port = 6379
spring.data.redis.password =
# Max connections in pool (-1 means unlimited), default 8
spring.data.redis.lettuce.pool.max-active = 8
# Max wait time for connection (-1 means unlimited), default -1
spring.data.redis.lettuce.pool.max-wait = -1ms
# Max idle connections in pool, default 8
spring.data.redis.lettuce.pool.max-idle = 8
# Min idle connections in pool, default 0
spring.data.redis.lettuce.pool.min-idle = 0
